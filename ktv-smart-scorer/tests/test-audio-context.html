<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Property Test — Noise Gate Boundary (Property 7)</title>
  <style>
    body {
      font-family: monospace;
      background: #111;
      color: #ccc;
      padding: 2rem;
    }
    h1 { color: #f0c040; margin-bottom: 0.25rem; }
    .subtitle { color: #888; font-size: 0.85rem; margin-bottom: 1.5rem; }
    #results { margin-top: 1rem; }
    .result-line {
      padding: 0.4rem 0.7rem;
      border-radius: 4px;
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
    }
    .pass { background: #1a3a1a; color: #4caf50; border-left: 4px solid #4caf50; }
    .fail { background: #3a1a1a; color: #f44336; border-left: 4px solid #f44336; }
    .info { background: #1a2a3a; color: #64b5f6; border-left: 4px solid #64b5f6; }
    #summary {
      margin-top: 1.5rem;
      font-size: 1.1rem;
      font-weight: bold;
      padding: 0.75rem 1rem;
      border-radius: 6px;
    }
    .summary-pass { background: #1a3a1a; color: #4caf50; }
    .summary-fail { background: #3a1a1a; color: #f44336; }
  </style>
</head>
<body>
  <h1>Property Test — Noise Gate Boundary</h1>
  <p class="subtitle">
    Property 7 &nbsp;|&nbsp; Validates: Requirements 4.2, 4.3, 4.4
  </p>
  <div id="results"></div>
  <div id="summary"></div>

  <script type="module">
    import fc from 'https://cdn.jsdelivr.net/npm/fast-check/+esm';

    // ---------------------------------------------------------------------------
    // Pure noise gate implementation (mirrors getFilteredBuffer RMS logic from
    // audioContext.js, but takes a Float32Array directly instead of an AnalyserNode)
    // ---------------------------------------------------------------------------
    function rmsGate(buffer, rmsThreshold) {
      let sumSq = 0;
      for (let i = 0; i < buffer.length; i++) sumSq += buffer[i] * buffer[i];
      const rms = Math.sqrt(sumSq / buffer.length);
      return rms >= rmsThreshold ? buffer : null;
    }

    // Helper: compute RMS of a Float32Array
    function computeRms(buffer) {
      let sumSq = 0;
      for (let i = 0; i < buffer.length; i++) sumSq += buffer[i] * buffer[i];
      return Math.sqrt(sumSq / buffer.length);
    }

    // ---------------------------------------------------------------------------
    // DOM helpers
    // ---------------------------------------------------------------------------
    const resultsEl = document.getElementById('results');
    const summaryEl = document.getElementById('summary');

    function log(message, type = 'info') {
      const div = document.createElement('div');
      div.className = `result-line ${type}`;
      div.textContent = message;
      resultsEl.appendChild(div);
    }

    // ---------------------------------------------------------------------------
    // Arbitrary generators
    // ---------------------------------------------------------------------------

    // Float32Array of length 1–256 with values in [-1, 1]
    const float32ArrayArb = fc.array(
      fc.float({ min: -1.0, max: 1.0, noNaN: true }),
      { minLength: 1, maxLength: 256 }
    ).map(arr => new Float32Array(arr));

    // RMS threshold in [0, 1]
    const rmsThresholdArb = fc.float({ min: 0, max: 1, noNaN: true });

    // ---------------------------------------------------------------------------
    // Property 7: Noise Gate Boundary
    //
    // For any Float32Array `buf` and any rmsThreshold in [0, 1]:
    //   - If rmsGate(buf, threshold) === null  → RMS(buf) < threshold
    //   - If rmsGate(buf, threshold) !== null  → RMS(buf) >= threshold
    //
    // Validates: Requirements 4.2, 4.3, 4.4
    // ---------------------------------------------------------------------------
    const results = [];

    // --- Sub-property A: null return implies RMS below threshold ---
    try {
      fc.assert(
        fc.property(float32ArrayArb, rmsThresholdArb, (buf, threshold) => {
          const result = rmsGate(buf, threshold);
          const rms = computeRms(buf);

          if (result === null) {
            // Must mean RMS < threshold
            return rms < threshold;
          }
          return true; // non-null case covered by sub-property B
        }),
        { numRuns: 10000 }
      );
      log('✓ Property 7A passed (10 000 runs): when result is null → RMS < threshold', 'pass');
      results.push(true);
    } catch (err) {
      log(`✗ Property 7A FAILED: ${err.message}`, 'fail');
      results.push(false);
    }

    // --- Sub-property B: non-null return implies RMS >= threshold ---
    try {
      fc.assert(
        fc.property(float32ArrayArb, rmsThresholdArb, (buf, threshold) => {
          const result = rmsGate(buf, threshold);
          const rms = computeRms(buf);

          if (result !== null) {
            // Must mean RMS >= threshold
            return rms >= threshold;
          }
          return true; // null case covered by sub-property A
        }),
        { numRuns: 10000 }
      );
      log('✓ Property 7B passed (10 000 runs): when result is non-null → RMS >= threshold', 'pass');
      results.push(true);
    } catch (err) {
      log(`✗ Property 7B FAILED: ${err.message}`, 'fail');
      results.push(false);
    }

    // --- Sub-property C: return value is the exact same buffer reference (not a copy) ---
    try {
      fc.assert(
        fc.property(float32ArrayArb, rmsThresholdArb, (buf, threshold) => {
          const result = rmsGate(buf, threshold);
          // If a buffer is returned, it must be the same reference as the input
          if (result !== null) {
            return result === buf;
          }
          return true;
        }),
        { numRuns: 10000 }
      );
      log('✓ Property 7C passed (10 000 runs): non-null result is same buffer reference as input', 'pass');
      results.push(true);
    } catch (err) {
      log(`✗ Property 7C FAILED: ${err.message}`, 'fail');
      results.push(false);
    }

    // --- Sub-property D: combined biconditional (null ↔ RMS < threshold) ---
    try {
      fc.assert(
        fc.property(float32ArrayArb, rmsThresholdArb, (buf, threshold) => {
          const result = rmsGate(buf, threshold);
          const rms = computeRms(buf);
          // null  ↔  rms < threshold
          // !null ↔  rms >= threshold
          const shouldBeNull = rms < threshold;
          return (result === null) === shouldBeNull;
        }),
        { numRuns: 10000 }
      );
      log('✓ Property 7D passed (10 000 runs): null ↔ RMS < threshold (full biconditional)', 'pass');
      results.push(true);
    } catch (err) {
      log(`✗ Property 7D FAILED: ${err.message}`, 'fail');
      results.push(false);
    }

    // --- Edge case: all-zero buffer always returns null (RMS = 0 < any positive threshold) ---
    try {
      fc.assert(
        fc.property(
          fc.integer({ min: 1, max: 256 }),
          fc.float({ min: 1e-9, max: 1, noNaN: true }),
          (len, threshold) => {
            const zeroBuf = new Float32Array(len); // all zeros
            const result = rmsGate(zeroBuf, threshold);
            return result === null;
          }
        ),
        { numRuns: 1000 }
      );
      log('✓ Edge case passed (1 000 runs): all-zero buffer → null for any positive threshold', 'pass');
      results.push(true);
    } catch (err) {
      log(`✗ Edge case FAILED: ${err.message}`, 'fail');
      results.push(false);
    }

    // --- Edge case: threshold = 0 → buffer always returned (RMS >= 0 always) ---
    try {
      fc.assert(
        fc.property(float32ArrayArb, (buf) => {
          const result = rmsGate(buf, 0);
          return result !== null;
        }),
        { numRuns: 1000 }
      );
      log('✓ Edge case passed (1 000 runs): threshold = 0 → buffer always returned', 'pass');
      results.push(true);
    } catch (err) {
      log(`✗ Edge case FAILED: ${err.message}`, 'fail');
      results.push(false);
    }

    // ---------------------------------------------------------------------------
    // Summary
    // ---------------------------------------------------------------------------
    const passed = results.filter(Boolean).length;
    const total = results.length;
    const allPassed = passed === total;

    summaryEl.className = allPassed ? 'summary-pass' : 'summary-fail';
    summaryEl.textContent = allPassed
      ? `ALL TESTS PASSED (${passed}/${total})`
      : `TESTS FAILED: ${passed}/${total} passed`;
  </script>
</body>
</html>
