<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lyric Display — Property Tests</title>
  <style>
    body {
      font-family: monospace;
      background: #111;
      color: #eee;
      padding: 2rem;
      max-width: 900px;
      margin: 0 auto;
    }
    h1 { color: #4fc3f7; margin-bottom: 0.25rem; }
    .subtitle { color: #888; font-size: 0.85rem; margin-bottom: 1.5rem; }
    .suite { border-left: 3px solid #2a5298; padding-left: 1rem; margin-bottom: 0.75rem; }
    .pass { color: #4caf50; }
    .fail { color: #f44336; }
    .info { color: #aaa; font-size: 0.85rem; margin-top: 0.2rem; }
    pre {
      background: #1e1e1e; padding: 0.75rem; border-radius: 4px;
      overflow-x: auto; font-size: 0.8rem; white-space: pre-wrap; word-break: break-word;
    }
    #summary {
      margin-top: 2rem; font-size: 1.1rem; font-weight: bold;
      padding: 0.75rem 1rem; border-radius: 6px;
    }
    .summary-pass { background: #1a3a1a; color: #4caf50; }
    .summary-fail { background: #3a1a1a; color: #f44336; }
    /* needed so initLyricDisplay can render into the hidden container */
    #lyric-sandbox { display: none; }
  </style>
</head>
<body>
  <h1>ktv-smart-scorer — Lyric Display Property Tests</h1>
  <p class="subtitle">
    Task 8.2 &nbsp;|&nbsp; Property 11 — Lyric Character Active State Correctness
    &nbsp;|&nbsp; Validates: Requirements 11.2, 11.3
  </p>

  <!-- Off-screen sandbox container for DOM testing -->
  <div id="lyric-sandbox"></div>

  <div id="output"></div>
  <div id="summary"></div>

  <script type="module">
    import fc from 'https://cdn.jsdelivr.net/npm/fast-check/+esm';
    import { initLyricDisplay, updateLyrics, resetLyrics } from '../src/ui/lyricDisplay.js';

    // -------------------------------------------------------------------------
    // Helpers
    // -------------------------------------------------------------------------
    const sandbox = document.getElementById('lyric-sandbox');

    /** Creates a fresh container inside the sandbox for each test run. */
    function makeContainer() {
      const div = document.createElement('div');
      sandbox.appendChild(div);
      return div;
    }

    /** Builds a minimal lyrics array from an array of { start, end } timing objects. */
    function makeLyrics(timings) {
      return [{
        lineId: 1,
        text: timings.map((_, i) => String.fromCharCode(65 + (i % 26))).join(''),
        chars: timings.map((t, i) => ({
          char: String.fromCharCode(65 + (i % 26)),
          start: t.start,
          end: t.end,
        })),
      }];
    }

    // -------------------------------------------------------------------------
    // Minimal test runner
    // -------------------------------------------------------------------------
    const results = [];

    async function test(label, description, fn) {
      const entry = { label, description, status: 'pass', detail: '' };
      try { await fn(); }
      catch (err) { entry.status = 'fail'; entry.detail = err?.message ?? String(err); }
      results.push(entry);
      render();
    }

    function render() {
      const out = document.getElementById('output');
      out.innerHTML = results.map(r => `
        <div class="suite">
          <div>
            <span class="${r.status === 'pass' ? 'pass' : 'fail'}">
              ${r.status === 'pass' ? '✓' : '✗'} ${escHtml(r.label)}
            </span>
          </div>
          <div class="info">${escHtml(r.description)}</div>
          ${r.detail ? `<pre>${escHtml(r.detail)}</pre>` : ''}
        </div>
      `).join('');

      const passed = results.filter(r => r.status === 'pass').length;
      const total  = results.length;
      const sum = document.getElementById('summary');
      sum.className = passed === total ? 'summary-pass' : 'summary-fail';
      sum.textContent = passed === total
        ? `ALL TESTS PASSED (${passed}/${total})`
        : `TESTS FAILED: ${passed}/${total} passed`;
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // =========================================================================
    // UNIT TESTS
    // =========================================================================

    await test(
      'Unit: initLyricDisplay creates one <span> per character',
      'Each LyricChar entry becomes exactly one <span> in the DOM. Validates: Requirement 11.1',
      () => {
        const container = makeContainer();
        const timings = [
          { start: 0,   end: 500 },
          { start: 500, end: 1000 },
          { start: 1000, end: 1500 },
        ];
        const state = initLyricDisplay(container, makeLyrics(timings));
        if (state.spans.length !== timings.length) {
          throw new Error(`Expected ${timings.length} spans, got ${state.spans.length}`);
        }
        const domSpans = container.querySelectorAll('span');
        if (domSpans.length !== timings.length) {
          throw new Error(`Expected ${timings.length} DOM spans, got ${domSpans.length}`);
        }
      }
    );

    await test(
      'Unit: no spans are active immediately after initLyricDisplay',
      'All spans start without the active class. Validates: Requirement 11.1',
      () => {
        const container = makeContainer();
        const state = initLyricDisplay(container, makeLyrics([
          { start: 100, end: 500 },
          { start: 500, end: 1000 },
        ]));
        for (const entry of state.spans) {
          if (entry.active) throw new Error('span.active should be false after init');
          if (entry.span.classList.contains('active')) {
            throw new Error('span DOM element has class "active" after init');
          }
        }
      }
    );

    await test(
      'Unit: updateLyrics activates the correct span at a specific time',
      'At t=200, only the span with start<=200<end gets class "active". Validates: Requirement 11.2',
      () => {
        const container = makeContainer();
        const state = initLyricDisplay(container, makeLyrics([
          { start: 0,   end: 300 },  // should be active at t=200
          { start: 300, end: 600 },  // not yet
          { start: 600, end: 900 },  // not yet
        ]));
        updateLyrics(state, 200);
        if (!state.spans[0].active) throw new Error('span[0] should be active at t=200');
        if (state.spans[1].active)  throw new Error('span[1] should not be active at t=200');
        if (state.spans[2].active)  throw new Error('span[2] should not be active at t=200');
        if (!state.spans[0].span.classList.contains('active')) {
          throw new Error('span[0] DOM element missing class "active" at t=200');
        }
      }
    );

    await test(
      'Unit: start boundary is inclusive (start <= currentTimeMs)',
      'A span becomes active exactly when currentTimeMs === start. Validates: Requirement 11.2',
      () => {
        const container = makeContainer();
        const state = initLyricDisplay(container, makeLyrics([
          { start: 500, end: 1000 },
        ]));
        // Just before: not active
        updateLyrics(state, 499);
        if (state.spans[0].active) throw new Error('Should not be active at t=499 (start=500)');
        // Exactly at start: active
        updateLyrics(state, 500);
        if (!state.spans[0].active) throw new Error('Should be active at t=500 (start=500)');
      }
    );

    await test(
      'Unit: end boundary is exclusive (currentTimeMs < end)',
      'A span becomes inactive exactly when currentTimeMs === end. Validates: Requirement 11.3',
      () => {
        const container = makeContainer();
        const state = initLyricDisplay(container, makeLyrics([
          { start: 500, end: 1000 },
        ]));
        // Just before end: still active
        updateLyrics(state, 999);
        if (!state.spans[0].active) throw new Error('Should be active at t=999 (end=1000)');
        // At end: no longer active
        updateLyrics(state, 1000);
        if (state.spans[0].active) throw new Error('Should not be active at t=1000 (end=1000)');
      }
    );

    await test(
      'Unit: resetLyrics removes active class from all spans',
      'After resetLyrics, no span has class "active" or entry.active === true. Validates: Requirement 11.4',
      () => {
        const container = makeContainer();
        const state = initLyricDisplay(container, makeLyrics([
          { start: 0,   end: 500 },
          { start: 500, end: 1000 },
          { start: 1000, end: 1500 },
        ]));
        // Activate some
        updateLyrics(state, 250);
        updateLyrics(state, 750);
        // Reset
        resetLyrics(state);
        for (const entry of state.spans) {
          if (entry.active) throw new Error('entry.active should be false after reset');
          if (entry.span.classList.contains('active')) {
            throw new Error('DOM span still has "active" class after reset');
          }
        }
      }
    );

    await test(
      'Unit: updateLyrics only mutates changed spans (efficiency check)',
      'classList.add/remove is called only when state changes, not on every frame. Validates: Requirement 11.5',
      () => {
        const container = makeContainer();
        const state = initLyricDisplay(container, makeLyrics([
          { start: 0, end: 1000 },
          { start: 1000, end: 2000 },
        ]));

        // Count classList mutations by wrapping classList methods
        let mutations = 0;
        for (const entry of state.spans) {
          const origAdd = entry.span.classList.add.bind(entry.span.classList);
          const origRemove = entry.span.classList.remove.bind(entry.span.classList);
          entry.span.classList.add = (...args) => { mutations++; origAdd(...args); };
          entry.span.classList.remove = (...args) => { mutations++; origRemove(...args); };
        }

        // First call: span[0] becomes active → 1 mutation expected
        mutations = 0;
        updateLyrics(state, 500);
        const firstCallMutations = mutations;
        if (firstCallMutations !== 1) {
          throw new Error(`Expected 1 mutation on first call (activate span[0]), got ${firstCallMutations}`);
        }

        // Second call with same time: no state change → 0 mutations
        mutations = 0;
        updateLyrics(state, 500);
        if (mutations !== 0) {
          throw new Error(`Expected 0 mutations on redundant call (same time), got ${mutations}`);
        }
      }
    );

    // =========================================================================
    // PROPERTY 11: Lyric Character Active State Correctness
    //
    // For any LyricChar with start/end and any currentTimeMs:
    //   span has class "active"  ↔  start <= currentTimeMs < end
    //
    // Validates: Requirements 11.2, 11.3
    // =========================================================================

    await test(
      'Property 11: Active state correctness — biconditional (2000 runs)',
      'span.active ↔ (start <= currentTimeMs < end) for any timing and any time value. Validates: Requirements 11.2, 11.3',
      async () => {
        // Arbitrary: a list of non-overlapping char timings (sequential, no gaps required)
        const timingArb = fc.array(
          fc.integer({ min: 10, max: 500 }), // each char duration in ms
          { minLength: 1, maxLength: 20 }
        ).map(durations => {
          let t = 0;
          return durations.map(dur => {
            const timing = { start: t, end: t + dur };
            t += dur;
            return timing;
          });
        });

        // Time values: anywhere from -100 to total_duration + 100
        const timeArb = fc.integer({ min: -100, max: 20000 });

        await fc.assert(
          fc.property(timingArb, timeArb, (timings, currentTimeMs) => {
            const container = makeContainer();
            const state = initLyricDisplay(container, makeLyrics(timings));
            updateLyrics(state, currentTimeMs);

            for (let i = 0; i < state.spans.length; i++) {
              const entry = state.spans[i];
              const shouldBeActive =
                entry.start <= currentTimeMs && currentTimeMs < entry.end;

              // Check internal state flag
              if (entry.active !== shouldBeActive) {
                throw new Error(
                  `span[${i}] entry.active=${entry.active} but shouldBeActive=${shouldBeActive} ` +
                  `(start=${entry.start}, end=${entry.end}, t=${currentTimeMs})`
                );
              }

              // Check DOM class
              const hasClass = entry.span.classList.contains('active');
              if (hasClass !== shouldBeActive) {
                throw new Error(
                  `span[${i}] DOM classList.has('active')=${hasClass} but shouldBeActive=${shouldBeActive} ` +
                  `(start=${entry.start}, end=${entry.end}, t=${currentTimeMs})`
                );
              }
            }
            return true;
          }),
          { numRuns: 2000 }
        );
      }
    );

    await test(
      'Property 11: Active state after sequential time updates (500 runs)',
      'updateLyrics called with monotonically increasing times produces correct active states. Validates: Requirements 11.2, 11.3',
      async () => {
        const timingArb = fc.array(
          fc.integer({ min: 50, max: 300 }),
          { minLength: 1, maxLength: 10 }
        ).map(durations => {
          let t = 0;
          return durations.map(dur => {
            const timing = { start: t, end: t + dur };
            t += dur;
            return timing;
          });
        });

        // A sorted list of increasing time values to simulate a real rAF loop
        const timesArb = fc.array(
          fc.integer({ min: 0, max: 5000 }),
          { minLength: 1, maxLength: 30 }
        ).map(arr => arr.sort((a, b) => a - b));

        await fc.assert(
          fc.property(timingArb, timesArb, (timings, times) => {
            const container = makeContainer();
            const state = initLyricDisplay(container, makeLyrics(timings));

            for (const t of times) {
              updateLyrics(state, t);

              // Verify every span has the correct active state at this time
              for (let i = 0; i < state.spans.length; i++) {
                const entry = state.spans[i];
                const shouldBeActive = entry.start <= t && t < entry.end;
                if (entry.active !== shouldBeActive) {
                  throw new Error(
                    `At t=${t}: span[${i}] entry.active=${entry.active} but expected ${shouldBeActive} ` +
                    `(start=${entry.start}, end=${entry.end})`
                  );
                }
              }
            }
            return true;
          }),
          { numRuns: 500 }
        );
      }
    );

    await test(
      'Property 11: resetLyrics always clears all spans (500 runs)',
      'After resetLyrics(), every span entry.active is false and has no "active" class. Validates: Requirement 11.4',
      async () => {
        const timingArb = fc.array(
          fc.integer({ min: 50, max: 300 }),
          { minLength: 1, maxLength: 10 }
        ).map(durations => {
          let t = 0;
          return durations.map(dur => {
            const timing = { start: t, end: t + dur };
            t += dur;
            return timing;
          });
        });

        const timeArb = fc.integer({ min: 0, max: 5000 });

        await fc.assert(
          fc.property(timingArb, timeArb, (timings, currentTimeMs) => {
            const container = makeContainer();
            const state = initLyricDisplay(container, makeLyrics(timings));

            // Activate some spans
            updateLyrics(state, currentTimeMs);

            // Reset
            resetLyrics(state);

            // All spans must be inactive
            for (let i = 0; i < state.spans.length; i++) {
              const entry = state.spans[i];
              if (entry.active) {
                throw new Error(`span[${i}] still active after resetLyrics`);
              }
              if (entry.span.classList.contains('active')) {
                throw new Error(`span[${i}] DOM still has 'active' class after resetLyrics`);
              }
            }
            return true;
          }),
          { numRuns: 500 }
        );
      }
    );

  </script>
</body>
</html>
