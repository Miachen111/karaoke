<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Score Engine — Unit &amp; Property Tests</title>
  <style>
    body {
      font-family: monospace;
      background: #111;
      color: #eee;
      padding: 2rem;
      max-width: 900px;
      margin: 0 auto;
    }
    h1 { color: #4fc3f7; margin-bottom: 0.25rem; }
    h2 { color: #f0c040; margin-top: 2rem; margin-bottom: 0.5rem; }
    .subtitle { color: #888; font-size: 0.85rem; margin-bottom: 1.5rem; }
    .suite { border-left: 3px solid #2a5298; padding-left: 1rem; margin-bottom: 0.75rem; }
    .pass { color: #4caf50; }
    .fail { color: #f44336; }
    .info { color: #aaa; font-size: 0.85rem; margin-top: 0.2rem; }
    pre {
      background: #1e1e1e;
      padding: 0.75rem;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 0.8rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #summary {
      margin-top: 2rem;
      font-size: 1.1rem;
      font-weight: bold;
      padding: 0.75rem 1rem;
      border-radius: 6px;
    }
    .summary-pass { background: #1a3a1a; color: #4caf50; }
    .summary-fail { background: #3a1a1a; color: #f44336; }
  </style>
</head>
<body>
  <h1>ktv-smart-scorer — Score Engine Tests</h1>
  <p class="subtitle">
    Tasks 5.1 &amp; 5.3 &nbsp;|&nbsp; Properties 2, 3, 5, 6 &nbsp;|&nbsp;
    Validates: Requirements 7.1–7.7, 8.1, 8.2
  </p>

  <h2>Unit Tests</h2>
  <div id="unit-output"></div>

  <h2>Property Tests</h2>
  <div id="prop-output"></div>

  <div id="summary"></div>

  <script type="module">
    import fc from 'https://cdn.jsdelivr.net/npm/fast-check/+esm';
    import { initScoreEngine, evaluate, getVisibleNotes } from '../src/scoring/scoreEngine.js';

    // -------------------------------------------------------------------------
    // Sample note data — C3 scale, 1 s per note, no gaps, no overlaps
    // -------------------------------------------------------------------------
    const SAMPLE_NOTES = [
      { start: 0,    end: 1000, pitch: 48, note: 'C3' },
      { start: 1000, end: 2000, pitch: 50, note: 'D3' },
      { start: 2000, end: 3000, pitch: 52, note: 'E3' },
      { start: 3000, end: 4000, pitch: 53, note: 'F3' },
      { start: 4000, end: 5000, pitch: 55, note: 'G3' },
    ];

    // -------------------------------------------------------------------------
    // Minimal test runner
    // -------------------------------------------------------------------------
    const unitResults = [];
    const propResults = [];

    function assert(condition, message) {
      if (!condition) throw new Error(message || 'Assertion failed');
    }

    function assertEqual(actual, expected, label) {
      if (actual !== expected) {
        throw new Error(`${label}: expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
      }
    }

    function assertNull(val, label) {
      if (val !== null) throw new Error(`${label}: expected null, got ${JSON.stringify(val)}`);
    }

    function assertNotNull(val, label) {
      if (val === null) throw new Error(`${label}: expected non-null`);
    }

    async function unit(label, description, fn) {
      const entry = { label, description, status: 'pass', detail: '' };
      try { await fn(); }
      catch (err) { entry.status = 'fail'; entry.detail = err?.message ?? String(err); }
      unitResults.push(entry);
      renderResults('unit-output', unitResults);
    }

    async function prop(label, description, fn) {
      const entry = { label, description, status: 'pass', detail: '' };
      try { await fn(); }
      catch (err) { entry.status = 'fail'; entry.detail = err?.message ?? String(err); }
      propResults.push(entry);
      renderResults('prop-output', propResults);
    }

    function escHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function renderResults(containerId, results) {
      const el = document.getElementById(containerId);
      el.innerHTML = results.map(r => `
        <div class="suite">
          <div>
            <span class="${r.status === 'pass' ? 'pass' : 'fail'}">
              ${r.status === 'pass' ? '✓' : '✗'} ${escHtml(r.label)}
            </span>
          </div>
          <div class="info">${escHtml(r.description)}</div>
          ${r.detail ? `<pre>${escHtml(r.detail)}</pre>` : ''}
        </div>
      `).join('');
      updateSummary();
    }

    function updateSummary() {
      const all = [...unitResults, ...propResults];
      const passed = all.filter(r => r.status === 'pass').length;
      const total = all.length;
      const el = document.getElementById('summary');
      el.className = passed === total ? 'summary-pass' : 'summary-fail';
      el.textContent = passed === total
        ? `ALL TESTS PASSED (${passed}/${total})`
        : `TESTS FAILED: ${passed}/${total} passed`;
    }

    // =========================================================================
    // UNIT TESTS — initScoreEngine
    // =========================================================================

    await unit(
      'initScoreEngine: returns correct initial state',
      'score=0, totalHits=0, totalEvaluations=0, lastResult=null, notes stored. Requirements 7.1, 8.1',
      () => {
        const state = initScoreEngine(SAMPLE_NOTES);
        assertEqual(state.score, 0, 'score');
        assertEqual(state.totalHits, 0, 'totalHits');
        assertEqual(state.totalEvaluations, 0, 'totalEvaluations');
        assertNull(state.lastResult, 'lastResult');
        assertEqual(state.notes, SAMPLE_NOTES, 'notes reference');
      }
    );

    await unit(
      'initScoreEngine: works with empty notes array',
      'Empty notes array produces valid initial state. Requirements 7.1',
      () => {
        const state = initScoreEngine([]);
        assertEqual(state.score, 0, 'score');
        assertEqual(state.notes.length, 0, 'notes length');
      }
    );

    // =========================================================================
    // UNIT TESTS — evaluate: hit / miss logic
    // =========================================================================

    await unit(
      'evaluate: exact pitch match is a hit (+10 score)',
      'Singing the exact pitch of the active note earns 10 points. Requirements 7.4, 7.5',
      () => {
        const state = initScoreEngine(SAMPLE_NOTES);
        const result = evaluate(state, 500, 48); // C3 exact
        assertEqual(result.isHit, true, 'isHit');
        assertEqual(result.score, 10, 'score');
        assertEqual(state.score, 10, 'state.score');
        assertEqual(state.totalHits, 1, 'totalHits');
        assertEqual(state.totalEvaluations, 1, 'totalEvaluations');
      }
    );

    await unit(
      'evaluate: pitch within +0.5 semitones is a hit',
      '|error| = 0.5 is exactly at the boundary — should be a hit. Requirements 7.4',
      () => {
        const state = initScoreEngine(SAMPLE_NOTES);
        const result = evaluate(state, 500, 48.5); // C3 + 0.5
        assertEqual(result.isHit, true, 'isHit at +0.5');
        assertEqual(result.score, 10, 'score');
      }
    );

    await unit(
      'evaluate: pitch within -0.5 semitones is a hit',
      '|error| = 0.5 at the negative boundary — should be a hit. Requirements 7.4',
      () => {
        const state = initScoreEngine(SAMPLE_NOTES);
        const result = evaluate(state, 500, 47.5); // C3 - 0.5
        assertEqual(result.isHit, true, 'isHit at -0.5');
        assertEqual(result.score, 10, 'score');
      }
    );

    await unit(
      'evaluate: pitch just outside +0.5 semitones is a miss',
      '|error| = 0.501 just beyond boundary — miss, no score change. Requirements 7.4',
      () => {
        const state = initScoreEngine(SAMPLE_NOTES);
        const result = evaluate(state, 500, 48.501);
        assertEqual(result.isHit, false, 'isHit');
        assertEqual(result.score, 0, 'score unchanged');
        assertEqual(state.score, 0, 'state.score unchanged');
        assertEqual(state.totalHits, 0, 'totalHits unchanged');
      }
    );

    await unit(
      'evaluate: pitch outside -0.5 semitones is a miss',
      '|error| = 0.501 below — miss, no score change. Requirements 7.4',
      () => {
        const state = initScoreEngine(SAMPLE_NOTES);
        const result = evaluate(state, 500, 47.499);
        assertEqual(result.isHit, false, 'isHit');
        assertEqual(result.score, 0, 'score unchanged');
      }
    );

    await unit(
      'evaluate: null detectedMidiExact is always a miss',
      'No pitch detected → miss, score unchanged. Requirements 7.3, 7.6',
      () => {
        const state = initScoreEngine(SAMPLE_NOTES);
        const result = evaluate(state, 500, null);
        assertEqual(result.isHit, false, 'isHit');
        assertEqual(result.score, 0, 'score');
        assertNull(result.semitoneError, 'semitoneError');
        assertEqual(result.isInWindow, true, 'isInWindow (note is active)');
        assertEqual(state.totalEvaluations, 1, 'totalEvaluations still incremented');
      }
    );

    await unit(
      'evaluate: no active note at currentTimeMs is a miss',
      'Time falls in a gap — targetNote null, isInWindow false. Requirements 7.3, 7.6',
      () => {
        // Gap between 1000 and 1000 ms (exactly at boundary — end is exclusive for previous, start for next)
        const notes = [
          { start: 0, end: 1000, pitch: 48, note: 'C3' },
          { start: 2000, end: 3000, pitch: 50, note: 'D3' },
        ];
        const state = initScoreEngine(notes);
        // t=1500 is a gap
        const result = evaluate(state, 1500, 48);
        assertEqual(result.isHit, false, 'isHit');
        assertNull(result.targetNote, 'targetNote');
        assertEqual(result.isInWindow, false, 'isInWindow');
        assertEqual(result.score, 0, 'score');
      }
    );

    await unit(
      'evaluate: note boundary — start time is inclusive',
      'currentTimeMs === note.start should find that note. Requirements 7.2',
      () => {
        const state = initScoreEngine(SAMPLE_NOTES);
        const result = evaluate(state, 1000, 50); // D3 starts at 1000
        assertNotNull(result.targetNote, 'targetNote');
        assertEqual(result.targetNote.pitch, 50, 'target pitch');
        assertEqual(result.isHit, true, 'isHit');
      }
    );

    await unit(
      'evaluate: note boundary — end time is exclusive',
      'currentTimeMs === note.end must NOT find that note. Requirements 7.2',
      () => {
        const state = initScoreEngine(SAMPLE_NOTES);
        // t=1000 is end of C3 and start of D3 — should find D3, not C3
        const result = evaluate(state, 1000, 48); // C3 pitch, but D3 is active
        if (result.targetNote) {
          // D3 is active; C3 pitch (48) is 2 semitones away from D3 (50) → miss
          assertEqual(result.targetNote.pitch, 50, 'active note is D3');
          assertEqual(result.isHit, false, 'miss — wrong pitch');
        } else {
          // No note active at t=1000 is also acceptable if boundary is handled differently
          assertEqual(result.isHit, false, 'no active note → miss');
        }
      }
    );

    await unit(
      'evaluate: EvaluationResult has all required fields',
      'Result object must contain all fields defined in the type. Requirements 7.7',
      () => {
        const state = initScoreEngine(SAMPLE_NOTES);
        const result = evaluate(state, 500, 48);
        assert('isHit' in result, 'isHit field present');
        assert('isInWindow' in result, 'isInWindow field present');
        assert('targetNote' in result, 'targetNote field present');
        assert('detectedMidiExact' in result, 'detectedMidiExact field present');
        assert('semitoneError' in result, 'semitoneError field present');
        assert('score' in result, 'score field present');
        assertEqual(result.detectedMidiExact, 48, 'detectedMidiExact echoed');
      }
    );

    await unit(
      'evaluate: multiple consecutive hits accumulate score',
      'Five hits at 10 pts each → score = 50. Requirements 7.5',
      () => {
        const state = initScoreEngine(SAMPLE_NOTES);
        for (let i = 0; i < 5; i++) {
          evaluate(state, 500, 48); // all within C3 window
        }
        assertEqual(state.score, 50, 'accumulated score');
        assertEqual(state.totalHits, 5, 'totalHits');
        assertEqual(state.totalEvaluations, 5, 'totalEvaluations');
      }
    );

    await unit(
      'evaluate: score never decreases on miss',
      'After a hit, a miss must not reduce score. Requirements 7.7',
      () => {
        const state = initScoreEngine(SAMPLE_NOTES);
        evaluate(state, 500, 48);          // hit: score = 10
        const before = state.score;
        evaluate(state, 500, 60);          // miss: far off pitch
        assert(state.score >= before, 'score did not decrease');
        assertEqual(state.score, 10, 'score stays at 10');
      }
    );

    await unit(
      'evaluate: lastResult is updated after each call',
      'state.lastResult always reflects the most recent EvaluationResult. Requirements 7.7',
      () => {
        const state = initScoreEngine(SAMPLE_NOTES);
        assertNull(state.lastResult, 'lastResult null before any call');
        const r1 = evaluate(state, 500, 48);
        assert(state.lastResult === r1, 'lastResult is r1');
        const r2 = evaluate(state, 500, 60);
        assert(state.lastResult === r2, 'lastResult updated to r2');
      }
    );

    // =========================================================================
    // UNIT TESTS — getVisibleNotes
    // =========================================================================

    await unit(
      'getVisibleNotes: returns notes overlapping the window',
      'Notes that overlap [currentTimeMs, currentTimeMs+windowMs) are returned. Requirements 8.1, 8.2',
      () => {
        const state = initScoreEngine(SAMPLE_NOTES);
        // Window [0, 2500) should include C3 (0–1000), D3 (1000–2000), E3 (2000–3000 starts at 2000 < 2500)
        const visible = getVisibleNotes(state, 0, 2500);
        assertEqual(visible.length, 3, 'three notes visible');
      }
    );

    await unit(
      'getVisibleNotes: excludes notes that ended before currentTimeMs',
      'Notes with end <= currentTimeMs must not appear. Requirements 8.2',
      () => {
        const state = initScoreEngine(SAMPLE_NOTES);
        // At t=1500 with window=100ms, C3 (end=1000) is past; only D3 is visible
        const visible = getVisibleNotes(state, 1500, 100);
        assert(visible.every(n => n.end > 1500), 'all returned notes end after currentTimeMs');
        assertEqual(visible.length, 1, 'only D3 visible');
        assertEqual(visible[0].pitch, 50, 'D3');
      }
    );

    await unit(
      'getVisibleNotes: excludes notes that start after window end',
      'Notes with start >= currentTimeMs+windowMs must not appear. Requirements 8.2',
      () => {
        const state = initScoreEngine(SAMPLE_NOTES);
        // Window [0, 500): only C3 starts at 0 < 500; D3 starts at 1000 >= 500 → excluded
        const visible = getVisibleNotes(state, 0, 500);
        assert(visible.every(n => n.start < 500), 'all notes start before window end');
        assertEqual(visible.length, 1, 'only C3');
      }
    );

    await unit(
      'getVisibleNotes: returns empty array when no notes in window',
      'Window that covers no notes returns []. Requirements 8.2',
      () => {
        const state = initScoreEngine(SAMPLE_NOTES);
        // All notes end by 5000ms; window starting at 6000ms has nothing
        const visible = getVisibleNotes(state, 6000, 1000);
        assertEqual(visible.length, 0, 'empty result');
      }
    );

    await unit(
      'getVisibleNotes: works with empty notes array',
      'No notes at all → always returns []. Requirements 8.1',
      () => {
        const state = initScoreEngine([]);
        const visible = getVisibleNotes(state, 0, 3000);
        assertEqual(visible.length, 0, 'empty');
      }
    );

    await unit(
      'getVisibleNotes: note that spans current time is included',
      'A note already started and not yet ended must be visible. Requirements 8.1',
      () => {
        const state = initScoreEngine(SAMPLE_NOTES);
        // At t=500, window=0: C3 (0–1000) still overlaps because end(1000) > 500 and start(0) < 500+0? No — windowMs=0 means start < 500, so note at start=0 qualifies
        // Use windowMs=1 to be safe
        const visible = getVisibleNotes(state, 500, 1);
        assert(visible.some(n => n.pitch === 48), 'C3 is visible at t=500');
      }
    );

    // =========================================================================
    // PROPERTY TESTS
    // =========================================================================

    // -------------------------------------------------------------------------
    // Property 2: Score Monotonicity
    // For any sequence of evaluate() calls, state.score never decreases.
    // Validates: Requirements 7.4, 7.5, 7.7
    // -------------------------------------------------------------------------

    await prop(
      'Property 2: Score Monotonicity (500 runs)',
      'state.score never decreases between consecutive evaluate() calls. Validates: Requirements 7.4, 7.5, 7.7',
      async () => {
        // Arbitrary: a list of (timeMs, midiExact | null) evaluation calls
        const evalCallArb = fc.tuple(
          fc.integer({ min: 0, max: 4999 }), // currentTimeMs within note range
          fc.oneof(
            fc.float({ min: 0, max: 127, noNaN: true }), // detected pitch
            fc.constant(null)                              // no pitch
          )
        );

        await fc.assert(
          fc.property(
            fc.array(evalCallArb, { minLength: 1, maxLength: 50 }),
            (calls) => {
              const state = initScoreEngine(SAMPLE_NOTES);
              let prevScore = 0;
              for (const [t, midi] of calls) {
                const result = evaluate(state, t, midi);
                if (result.score < prevScore) {
                  throw new Error(
                    `Score decreased: ${prevScore} → ${result.score} at t=${t}, midi=${midi}`
                  );
                }
                prevScore = result.score;
              }
              return true;
            }
          ),
          { numRuns: 500 }
        );
      }
    );

    // -------------------------------------------------------------------------
    // Property 3: Hit Detection Boundary
    // isHit is true IFF |detectedMidiExact - targetNote.pitch| <= 0.5
    // Validates: Requirements 7.4
    // -------------------------------------------------------------------------

    await prop(
      'Property 3: Hit Detection Boundary (1000 runs)',
      'isHit ↔ |detectedMidiExact - targetNote.pitch| <= 0.5 for any pitch/target pair. Validates: Requirements 7.4',
      async () => {
        // Test against C3 (pitch=48) at t=500 (within the first note window)
        const midiArb = fc.float({ min: 0, max: 127, noNaN: true });

        await fc.assert(
          fc.property(midiArb, (detectedMidi) => {
            const state = initScoreEngine(SAMPLE_NOTES);
            const targetPitch = 48; // C3
            const result = evaluate(state, 500, detectedMidi);

            const error = Math.abs(detectedMidi - targetPitch);
            const shouldBeHit = error <= 0.5;

            if (result.isHit !== shouldBeHit) {
              throw new Error(
                `isHit=${result.isHit} but |${detectedMidi} - ${targetPitch}| = ${error.toFixed(6)} → shouldBeHit=${shouldBeHit}`
              );
            }
            return true;
          }),
          { numRuns: 1000 }
        );
      }
    );

    // -------------------------------------------------------------------------
    // Property 5: Evaluation Count Monotonicity
    // totalEvaluations increases by exactly 1 per call; totalHits <= totalEvaluations
    // Validates: Requirements 7.2, 7.5
    // -------------------------------------------------------------------------

    await prop(
      'Property 5: Evaluation Count Monotonicity (500 runs)',
      'totalEvaluations += 1 per call; totalHits <= totalEvaluations always. Validates: Requirements 7.2, 7.5',
      async () => {
        const evalCallArb = fc.tuple(
          fc.integer({ min: 0, max: 4999 }),
          fc.oneof(fc.float({ min: 0, max: 127, noNaN: true }), fc.constant(null))
        );

        await fc.assert(
          fc.property(
            fc.array(evalCallArb, { minLength: 1, maxLength: 50 }),
            (calls) => {
              const state = initScoreEngine(SAMPLE_NOTES);
              for (let i = 0; i < calls.length; i++) {
                const [t, midi] = calls[i];
                evaluate(state, t, midi);

                const expectedEvals = i + 1;
                if (state.totalEvaluations !== expectedEvals) {
                  throw new Error(
                    `totalEvaluations=${state.totalEvaluations} after ${expectedEvals} calls`
                  );
                }
                if (state.totalHits > state.totalEvaluations) {
                  throw new Error(
                    `totalHits (${state.totalHits}) > totalEvaluations (${state.totalEvaluations})`
                  );
                }
              }
              return true;
            }
          ),
          { numRuns: 500 }
        );
      }
    );

    // -------------------------------------------------------------------------
    // Property 6: Visible Notes Window Correctness
    // Every note returned satisfies: note.end > currentTimeMs AND note.start < currentTimeMs + windowMs
    // Validates: Requirements 8.1, 8.2
    // -------------------------------------------------------------------------

    await prop(
      'Property 6: Visible Notes Window Correctness (1000 runs)',
      'Every returned note satisfies note.end > currentTimeMs AND note.start < currentTimeMs + windowMs. Validates: Requirements 8.1, 8.2',
      async () => {
        await fc.assert(
          fc.property(
            fc.integer({ min: 0, max: 10000 }), // currentTimeMs
            fc.integer({ min: 1, max: 10000 }),  // windowMs
            (currentTimeMs, windowMs) => {
              const state = initScoreEngine(SAMPLE_NOTES);
              const visible = getVisibleNotes(state, currentTimeMs, windowMs);

              for (const note of visible) {
                if (note.end <= currentTimeMs) {
                  throw new Error(
                    `note (end=${note.end}) is not after currentTimeMs=${currentTimeMs}`
                  );
                }
                if (note.start >= currentTimeMs + windowMs) {
                  throw new Error(
                    `note (start=${note.start}) is not before window end=${currentTimeMs + windowMs}`
                  );
                }
              }
              return true;
            }
          ),
          { numRuns: 1000 }
        );
      }
    );

    // -------------------------------------------------------------------------
    // Property 6 (completeness): no note that SHOULD appear is missing
    // -------------------------------------------------------------------------

    await prop(
      'Property 6 (completeness): No qualifying note is omitted (500 runs)',
      'Every note satisfying the window condition is included in the result. Validates: Requirements 8.1, 8.2',
      async () => {
        await fc.assert(
          fc.property(
            fc.integer({ min: 0, max: 10000 }),
            fc.integer({ min: 1, max: 10000 }),
            (currentTimeMs, windowMs) => {
              const state = initScoreEngine(SAMPLE_NOTES);
              const visible = getVisibleNotes(state, currentTimeMs, windowMs);
              const visibleIds = new Set(visible.map(n => n.start + '_' + n.end));

              for (const note of SAMPLE_NOTES) {
                const shouldBeVisible =
                  note.end > currentTimeMs &&
                  note.start < currentTimeMs + windowMs;
                const isVisible = visibleIds.has(note.start + '_' + note.end);

                if (shouldBeVisible && !isVisible) {
                  throw new Error(
                    `Note {start=${note.start}, end=${note.end}} should be visible at t=${currentTimeMs} window=${windowMs} but was omitted`
                  );
                }
                if (!shouldBeVisible && isVisible) {
                  throw new Error(
                    `Note {start=${note.start}, end=${note.end}} should NOT be visible at t=${currentTimeMs} window=${windowMs} but was included`
                  );
                }
              }
              return true;
            }
          ),
          { numRuns: 500 }
        );
      }
    );

  </script>
</body>
</html>
